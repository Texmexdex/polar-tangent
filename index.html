      // =========================================================================
      // DYNAMIC SHADERTOY EXPORTER (Supports ALL 7 Shaders!)
      // =========================================================================
      function buildShadertoyCode() {
        const s = curShader();
        const st = curState();

        const header = `// ${s.name} — ${s.subtitle}
// Sacred Geometric Optical Loop Suite (Linear-RGB Optical Filter Blending)
// Paste directly into Shadertoy's "Image" tab (https://www.shadertoy.com/new)
${s.is3D ? "// Drag mouse in Shadertoy to orbit the 3D view!\n" : ""}
const float LOOP_DURATION = ${st.duration.toFixed(1)};
const float PHASE_OFFSET  = ${st.phase.toFixed(3)};
const int   uNumCircles   = ${st.numCircles};
const float uStagger      = ${st.stagger.toFixed(3)};
const int   uBlendMode    = ${st.blendMode};
const int   uSymmetry     = ${st.symmetry || 0};
const int   MAX_CIRCLES   = 24;
const float PI            = 3.14159265359;
const float TAU           = 6.28318530718;

vec3 srgb2lin(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  vec3 lo = c / 12.92;
  vec3 hi = pow((c + 0.055) / 1.055, vec3(2.4));
  return mix(lo, hi, step(vec3(0.04045), c));
}

vec3 lin2srgb(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  vec3 lo = 12.92 * c;
  vec3 hi = 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055;
  return mix(lo, hi, step(vec3(0.0031308), c));
}

vec3 gradientSRGB(float s) {
  float t = clamp(0.5 * s + 0.5, 0.0, 1.0);
  vec3 c0 = vec3(1.000, 1.000, 1.000);
  vec3 c1 = vec3(0.341, 0.679, 0.720);
  vec3 c2 = vec3(0.443, 0.294, 0.551);
  vec3 c3 = vec3(0.758, 0.240, 0.340);
  vec3 c4 = vec3(0.887, 0.513, 0.294);
  vec3 c5 = vec3(0.856, 0.840, 0.427);
  vec3 c6 = vec3(1.000, 1.000, 1.000);
  if (t < 0.1441) return mix(c0, c1, (t - 0.0000) / (0.1441 - 0.0000));
  if (t < 0.3130) return mix(c1, c2, (t - 0.1441) / (0.3130 - 0.1441));
  if (t < 0.4632) return mix(c2, c3, (t - 0.3130) / (0.4632 - 0.3130));
  if (t < 0.6045) return mix(c3, c4, (t - 0.4632) / (0.6045 - 0.4632));
  if (t < 0.7531) return mix(c4, c5, (t - 0.6045) / (0.7531 - 0.6045));
  return mix(c5, c6, clamp((t - 0.7531) / (0.9443 - 0.7531), 0.0, 1.0));
}

float staggeredProg(float staggerFrac, float u) {
  float u0 = uStagger * clamp(staggerFrac, 0.0, 1.0);
  return clamp((u - u0) / max(1.0 - u0, 1e-4), 0.0, 1.0);
}

float circleAngle(int k, float u) {
  float fk = float(k);
  float fn = float(uNumCircles);
  float frac = (uNumCircles > 1) ? (fn - fk) / (fn - 1.0) : 0.0;
  return 0.5 * PI - TAU * staggeredProg(frac, u);
}

vec2 rot2(vec2 p, float a) {
  float c = cos(a), s = sin(a);
  return vec2(c * p.x - s * p.y, s * p.x + c * p.y);
}

vec3 composePairLin(vec3 topLin, vec3 botLin) {
  if (uBlendMode == 4) return topLin;
  if (uBlendMode == 0) return topLin * botLin;
  if (uBlendMode == 1) return srgb2lin(lin2srgb(topLin) * lin2srgb(botLin));
  if (uBlendMode == 2) return 1.0 - (1.0 - topLin) * (1.0 - botLin);
  return srgb2lin(abs(lin2srgb(topLin) - lin2srgb(botLin)));
}
`;

        if (!s.is3D) {
          return header + s.bodySrc + `
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  float radiusPx = 0.485 * min(iResolution.x, iResolution.y);
  float px = 1.0 / radiusPx;
  float u = fract(iTime / LOOP_DURATION + PHASE_OFFSET);
  vec2 center = 0.5 * iResolution.xy;
  vec3 acc = vec3(0.0);
  acc += renderSampleLin((fragCoord + vec2(-0.375, -0.125) - center) / radiusPx, u, 0.5 * px);
  acc += renderSampleLin((fragCoord + vec2( 0.125, -0.375) - center) / radiusPx, u, 0.5 * px);
  acc += renderSampleLin((fragCoord + vec2( 0.375,  0.125) - center) / radiusPx, u, 0.5 * px);
  acc += renderSampleLin((fragCoord + vec2(-0.125,  0.375) - center) / radiusPx, u, 0.5 * px);
  fragColor = vec4(lin2srgb(acc * 0.25), 1.0);
}
`;
        } else {
          // Strip WebGL main() from BODY_TANGENT_3D and emit Shadertoy mainImage with iMouse orbit
          const core3D = s.bodySrc.split("vec3 traceSample3D")[0];
          return header + core3D + `
vec3 traceSampleST(vec2 fragCoord, vec2 subOffset, vec2 res, float u, vec2 camRot, float camZoom) {
  float minDim = min(res.x, res.y);
  float px = 2.0 / minDim;
  vec2 uv = (fragCoord + subOffset - 0.5 * res) / (0.5 * minDim);
  vec3 ro = camZoom * vec3(cos(camRot.y) * sin(camRot.x), sin(camRot.y), cos(camRot.y) * cos(camRot.x));
  vec3 fwd = normalize(-ro);
  vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, fwd);
  vec3 rd = normalize(fwd * 2.45 + right * uv.x + up * uv.y);
  if (uSymmetry == 1) return renderGlassSpheres(ro, rd, u, px);
  if (uSymmetry == 2) return renderReliefAstrolabe(ro, rd, u, px);
  if (uSymmetry == 3) return renderVillarceauTorus(ro, rd, u, px);
  return renderCutawaySphere(ro, rd, u, px);
}

void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  float u = fract(iTime / LOOP_DURATION + PHASE_OFFSET);
  vec2 camRot = vec2(${(st.camYaw || 0.46).toFixed(3)} + 0.32 * sin(iTime * 0.4), ${(st.camPitch || 0.24).toFixed(3)});
  if (iMouse.z > 0.0) {
    vec2 m = (iMouse.xy / iResolution.xy) * 2.0 - 1.0;
    camRot = vec2(-m.x * PI, clamp(m.y * 1.3, -1.4, 1.4));
  }
  vec3 acc = vec3(0.0);
  acc += traceSampleST(fragCoord, vec2(-0.25, -0.25), iResolution.xy, u, camRot, ${(st.camZoom || 2.72).toFixed(2)});
  acc += traceSampleST(fragCoord, vec2( 0.25,  0.25), iResolution.xy, u, camRot, ${(st.camZoom || 2.72).toFixed(2)});
  fragColor = vec4(lin2srgb(acc * 0.5), 1.0);
}
`;
        }
      }

      btnCopy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(buildShadertoyCode());
          showToast(`Copied ${curShader().name} Shadertoy GLSL`);
        } catch {
          showToast("Clipboard blocked by browser");
        }
      });

      // High-res 2048x2048 PNG snapshot
      btnPng.addEventListener("click", () => {
        const s = curShader();
        const st = curState();
        const prevW = canvas.width, prevH = canvas.height;
        customRenderSize = 2048;
        canvas.width = 2048;
        canvas.height = 2048;
        gl.viewport(0, 0, 2048, 2048);
        renderFrame(undefined, true);
        canvas.toBlob((blob) => {
          customRenderSize = null;
          canvas.width = prevW;
          canvas.height = prevH;
          gl.viewport(0, 0, prevW, prevH);
          renderFrame();
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${s.id}-${Math.round(st.phase * 1000)}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast(`Saved 2048x2048 PNG (${s.name})`);
        }, "image/png");
      });

      // Record one exact seamless WebM loop
      btnRecord.addEventListener("click", () => {
        if (isRecording) return;
        if (typeof MediaRecorder === "undefined" || !canvas.captureStream) {
          showToast("WebM recording not supported in this browser");
          return;
        }
        const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
          .find((m) => MediaRecorder.isTypeSupported(m));
        if (!mime) {
          showToast("No supported WebM codec found");
          return;
        }

        const s = curShader();
        const st = curState();
        isRecording = true;
        hudToggle.classList.add("recording");
        hudLabel.textContent = "Recording...";
        btnRecord.disabled = true;
        btnRecord.textContent = "Recording 1 full cycle...";

        const prevW = canvas.width, prevH = canvas.height;
        customRenderSize = 1080;
        canvas.width = 1080;
        canvas.height = 1080;
        gl.viewport(0, 0, 1080, 1080);

        const stream = canvas.captureStream(60);
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          isRecording = false;
          customRenderSize = null;
          canvas.width = prevW;
          canvas.height = prevH;
          gl.viewport(0, 0, prevW, prevH);
          hudToggle.classList.remove("recording");
          hudLabel.textContent = "Controls";
          btnRecord.disabled = false;
          btnRecord.textContent = "Record 1 Seamless Loop (.webm)";

          const blob = new Blob(chunks, { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${s.id}-${st.duration}s-loop.webm`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          showToast(`Downloaded seamless WebM (${s.name})`);
        };

        const startPhase = st.phase;
        const baseYaw = st.camYaw || 0.46;
        const startTs = performance.now();
        const durMs = st.duration * 1000;
        rec.start();

        function recTick(now) {
          const elapsed = now - startTs;
          const frac = Math.min(elapsed / durMs, 1.0);
          st.phase = (startPhase + frac) % 1.0;
          if (s.is3D && st.autoOrbit) {
            if (st.symmetry === 0) {
              st.camYaw = baseYaw + 0.30 * Math.sin(frac * Math.PI * 2);
            } else {
              st.camYaw = baseYaw + frac * Math.PI * 2;
            }
          }
          renderFrame(st.phase);
          if (elapsed < durMs) {
            requestAnimationFrame(recTick);
          } else {
            st.camYaw = baseYaw;
            rec.stop();
          }
        }
        requestAnimationFrame(recTick);
      });

      // Keyboard shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.code === "Escape") {
          closeDropdown();
        } else if (e.code === "Space") {
          e.preventDefault();
          playing = !playing;
          syncUI();
        } else if (e.key === "[") {
          selectShader((activeIdx - 1 + SHADERS.length) % SHADERS.length);
        } else if (e.key === "]") {
          selectShader((activeIdx + 1) % SHADERS.length);
        } else if (e.key >= "1" && e.key <= String(SHADERS.length)) {
          selectShader(parseInt(e.key, 10) - 1);
        } else if (e.key === "h" || e.key === "H") {
          document.body.classList.toggle("pure-mode");
        } else if (e.key === "f" || e.key === "F") {
          btnFs.click();
        } else if (e.key === "r" || e.key === "R") {
          btnReset.click();
        }
      });

      // Expose testing & automation API on window
      window.__LOOP_API__ = {
        getShaders: () => SHADERS.map((s, idx) => ({ idx, id: s.id, name: s.name, is3D: s.is3D })),
        selectShader(idx) { selectShader(idx); renderFrame(); },
        setSymmetry(v) { curState().symmetry = v; syncUI(); renderFrame(); },
        setPhase(u) { playing = false; curState().phase = u; syncUI(); renderFrame(u); },
        setBlend(m) { curState().blendMode = m; syncUI(); renderFrame(); },
        openControls() { panel.classList.remove("hidden"); syncUI(); },
        closeControls() { panel.classList.add("hidden"); }
      };
    })();
  </script>
</body>
</html>
